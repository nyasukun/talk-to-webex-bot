[project]
name = "local-voice-relay-worker"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mlx-whisper>=0.4.2,<0.5",
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "soundfile>=0.12,<1",
  "silero-vad>=6,<7",
  "resemblyzer==0.1.4",
  "setuptools>=70,<81",
  "noisereduce>=3.0,<4",
  "huggingface-hub>=0.34,<2",
]

[project.optional-dependencies]
voice = ["mlx-audio>=0.3.1,<0.5"]

[tool.uv]
package = false
