name: Validate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  raycast:
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  test:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1, Node 24
        with:
          version: "0.9.26"
          enable-cache: true
      - name: Install locked worker dependencies (no models)
        run: uv sync --frozen --project worker --python 3.12
      - name: Swift, worker and support script tests
        env:
          RELAY_TEST_PYTHON: ${{ github.workspace }}/worker/.venv/bin/python
        run: scripts/test.sh
      - name: Audit publishable files
        run: python3 scripts/audit-public.py
      - name: Package application without signing credentials
        run: scripts/build.sh --prepare
